<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>mango sorbet candle</title>
<meta name="description" content="a tiny interactive pixel-art candle. blow into your microphone to put it out." />
<meta name="theme-color" content="#050403" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕯️</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="stage">
  <canvas id="scene" width="180" height="240"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <div id="hint" class="veil-text">blow into your microphone</div>
  <div id="message" class="veil-text"></div>

  <button id="blow-btn" class="hidden" aria-label="hold to blow">hold to blow</button>

  <div id="intro">
    <p id="intro-title">happy birthday</p>
    <p id="intro-action">tap to begin</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
